spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true  # Форматирование SQL

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: DEBUG          # Показываем SQL запросы
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # Показываем значения параметров
    com.zaxxer.hikari: DEBUG
